# The package's CI: glitchr-studio/ci's reusable workflow, pinned to a commit (the PHP 8.4 image, the
# package installed alone, PHPUnit with the conformance suite, PHPStan against phpstan-baseline.neon,
# a consumer install without require-dev).
name: ci

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    uses: glitchr-studio/ci/.github/workflows/php-package.yml@138b69073f0983bce077fbb9e1f4e4ad88c77dc7
    with:
      smoke-class: 'Omnidocs\Registry'
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test Tests/js/omnidocs.test.cjs
